name: jcg-q30 immortalwrt-mt798x Builder

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: mt7981-ax3000.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev dwarves
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j16

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        echo "FILE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "KOMDS=$PWD/packages" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload kmods
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: kmods${{ env.FILE_DATE }}
        path: ${{ env.KOMDS }}
        if-no-files-found: ignore

    - name: Publish release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: build-${{ env.FILE_DATE }}-${{ github.run_number }}
        name: jcg_q30-pro ${{ env.FILE_DATE }} build ${{ github.run_number }}
        body: |
          ## 中文说明

          本项目为 **JCG Q30 PRO**（MT7981）自动编译的 ImmortalWrt 25.12 固件。

          - 源码：chasey-dev/immortalwrt-mt798x-rebase（25.12 分支）
          - 目标：mediatek/filogic `jcg_q30-pro`（OpenWrt U-Boot / 112M UBI 布局）
          - 内容：固件镜像 + 可选 kmod（apk 包）

          ### honk 依赖支持（本固件已全部内置）
          本固件已内置 **honk（eBPF 代理内核）运行所需的全部依赖**，无需再手动解包安装：

          - 内核 BTF：`/sys/kernel/btf/vmlinux`（`CONFIG_DEBUG_INFO_BTF=y`、`CONFIG_DEBUG_INFO_BTF_MODULES=y`）
          - `kmod-nfnetlink-queue`：NFQUEUE 子系统（`nfnetlink_queue.ko`）
          - `kmod-nft-queue`：nftables `queue` 表达式（`nft_queue.ko`）
          - `kmod-sched-bpf`：`cls_bpf.ko`、`act_bpf.ko`
          - `kmod-sched-core`：`sch_ingress.ko`（提供 clsact qdisc，eBPF TC 重定向数据路径）
          - `kmod-veth`：honk 数据路径所需虚拟网卡
          - `ip-full`：已用 `ip-full` 替换默认的 `ip-tiny`

          因此可直接从 daeuniverse 源安装：

          ```sh
          FEED=https://openwrt.daeuniverse.org/25.12
          mkdir -p /etc/apk/repositories.d
          echo "@daeuniverse $FEED/packages/aarch64_cortex-a53/packages.adb" > /etc/apk/repositories.d/daeuniverse.list
          wget -O /etc/apk/keys/daeuniverse.pem https://openwrt.daeuniverse.org/public-key.pem
          apk update
          apk add honk@daeuniverse luci-app-honk@daeuniverse
          ```

          注意：源地址必须写 `25.12`（不要带 `-SNAPSHOT`），否则索引下载失败。

          ### 本次改动（2026-11-18）
          - 勾选 honk 依赖的 kmod 包：`kmod-nfnetlink-queue`、`kmod-nft-queue`、`kmod-sched-bpf`
          - 用 `ip-full` 替代 `ip-tiny`（`# CONFIG_PACKAGE_ip-tiny is not set`）
          - 保留内核 BTF 支持（`CONFIG_DEBUG_INFO_BTF=y` 等，用于 honk、dae 等 eBPF 程序）
          - 验证方式：刷入后 `lsmod | grep -E 'nft_queue|nfnetlink_queue|cls_bpf|act_bpf'` 均能加载，`ls -l /sys/kernel/btf/vmlinux` 存在
          - 提示：honk 面板默认 9090 端口，需避免与 mihomo/nikki 冲突

          ### 刷写步骤
          1. 先确认 `cat /proc/partitions` 中 `mtdblock4` 为 `114688`（112M）；若为 `113152` 需先刷匹配的 U-Boot。
          2. 正常升级刷 `immortalwrt-mediatek-filogic-jcg_q30-pro-squashfs-sysupgrade.itb`。
          3. 变砖救援用 `immortalwrt-mediatek-filogic-jcg_q30-pro-initramfs-recovery.itb`。
          4. 校验：`sha256sum -c sha256sums`。

          ### 可选 kmod
          与本次固件同一次构建，内核版本严格匹配：
          ```sh
          apk add --allow-untrusted ./kmod-wireguard-*.apk
          ```

          ---
          Automated build for JCG Q30 PRO
          - source: chasey-dev immortalwrt-mt798x-rebase (25.12)
          - target: mediatek/filogic jcg_q30-pro
          - contents: firmware images and optional kmod apk packages
        files: |
          ${{ env.FIRMWARE }}/*
          ${{ env.KOMDS }}/*
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
